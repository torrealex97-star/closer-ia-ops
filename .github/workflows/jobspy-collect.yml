name: JobSpy collect
# Recolector diario de ofertas en España (Indeed, LinkedIn, Google Jobs) con JobSpy. Envía BORRADORES al panel.
# Riesgo asumido por el operador (ADR-011): estas webs restringen el scraping en sus condiciones de uso.
# Secretos del repositorio necesarios: INGEST_URL (https://<dominio>/api/ingest) e INGEST_TOKEN (el mismo que INGEST_TOKEN en Vercel).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sitios separados por coma (indeed,linkedin,google)'
        default: 'indeed,linkedin,google'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-jobspy==1.1.82
      - name: Recoger y enviar borradores
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python scripts/jobspy_collect.py --sites "${{ github.event.inputs.sites || 'indeed,linkedin,google' }}"
