name: JobSpy collect
# Recolector diario de ofertas en España (Indeed, LinkedIn, Glassdoor, Google Jobs) con JobSpy. Envía BORRADORES al panel.
# Riesgo asumido por el operador (ADR-011): estas webs restringen el scraping en sus condiciones de uso.
# Secretos del repositorio necesarios: INGEST_URL (https://<dominio>/api/ingest) e INGEST_TOKEN (el mismo que INGEST_TOKEN en Vercel).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Sitios separados por coma (indeed,linkedin,glassdoor,google)'
        default: 'indeed,linkedin,glassdoor,google'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Commit fijado de speedyapply/JobSpy (revisado, 2026-10-14): más reciente que PyPI 1.3.0, con informe de errores por sitio.
      - run: python -m pip install "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git@1988484ac76ff9ae57784750346842e967e8ba10"
      - name: Recoger y enviar borradores
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SITES: ${{ github.event.inputs.sites || 'indeed,linkedin,glassdoor,google' }}
          JOBSPY_PROXIES: ${{ secrets.JOBSPY_PROXIES }}   # opcional: proxies separados por coma si LinkedIn/Indeed bloquean a GitHub
        run: python scripts/jobspy_collect.py --sites "$SITES"
