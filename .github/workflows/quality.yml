name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-lock.txt
      - run: npm ci
      - run: npm run contracts
      - run: git diff --exit-code packages/contracts
      - run: .venv/bin/python -m ruff check apps/api scripts/openapi.py tests/test_engine.py
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/career-dev.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3100/api/backend/config; then exit 0; fi
            sleep 2
          done
          cat /tmp/career-dev.log
          exit 1
      - run: npm run test:e2e
  # Pruebas del panel y del portal de alumnas (tests/admin-auth): Supabase y motor simulados. Job aparte para no tocar el anterior.
  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/handoff.mjs && npm run handoff
      - run: node tests/design.mjs && npm run design
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
