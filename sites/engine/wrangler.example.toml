# Despliegue del motor en una cuenta PROPIA de Cloudflare (ADR-018).
#
# Copia este archivo a `sites/engine/wrangler.toml` y pon el `database_id` que imprime
# `npx wrangler d1 create closer-engine`. El despliegue gestionado (Freebuff Sites) sigue usando
# `deploy-manifest.json`: este archivo NO lo sustituye, es la vía de la cuenta propia y el camino de
# vuelta si algo sale mal (la base gestionada no se toca).
name = "closer-engine"
main = "worker.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[vars]
# Presupuesto de subrequests que el motor se da por pasada. El Worker de pago admite 10.000 por
# invocación (el gratuito, 50), pero el CÓDIGO aún topa en 50 (`PLATFORM_SUBREQUEST_LIMIT`): subir
# esta variable por encima de 50 no hace nada hasta cambiar esa constante. Se deja en 50 para que la
# configuración no prometa algo que el motor no hace.
MAX_SUBREQUESTS = "50"
# Guardián de cuota: techo del plan de pago (50 M de filas escritas al mes) y SIN freno diario
# (`0`), porque el plan de pago no tiene tope diario. El margen del 15 % se conserva: es lo que
# absorbe el error de estimación del propio registro.
WRITE_ALLOWANCE_MONTH = "50000000"
WRITE_ALLOWANCE_DAY = "0"
WRITE_GUARD_RATIO = "0.85"

[[d1_databases]]
binding = "DB"
database_name = "closer-engine"
database_id = "<database-id-de-wrangler-d1-create>"

[triggers]
crons = ["0 */6 * * *"]

# Los secretos NO van aquí: `npx wrangler secret put ADMIN_TOKEN` y `... COLLECT_TOKEN`.
# `ADMIN_TOKEN` es el que la web usa como `CAREER_ADMIN_TOKEN`; se rota en el mismo corte.
